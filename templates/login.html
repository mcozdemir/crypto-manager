<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş · Kripto Formasyon Tarayıcı</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1e2230; --border: #2a2f3f;
    --text: #e6e8ef; --muted: #8b93a7; --red: #ef5350; --blue: #4f8ef7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
  }
  .card {
    width: 100%; max-width: 360px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px;
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 11px 12px; font-size: 15px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  input:focus { border-color: var(--blue); }
  input.code { letter-spacing: 6px; font-size: 20px; text-align: center; font-variant-numeric: tabular-nums; }
  button {
    width: 100%; margin-top: 22px; padding: 12px; font-size: 15px; font-weight: 600;
    color: #fff; background: var(--blue); border: 0; border-radius: 8px; cursor: pointer;
  }
  .error {
    margin-top: 16px; padding: 10px 12px; font-size: 13px; border-radius: 8px;
    color: var(--red); background: rgba(239, 83, 80, 0.1); border: 1px solid rgba(239, 83, 80, 0.3);
  }
  .hint { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
  <form class="card" method="post" autocomplete="off">
    <h1>📊 Kripto Formasyon Tarayıcı</h1>
    <p class="sub">Devam etmek için giriş yapın</p>

    <label for="username">Kullanıcı adı</label>
    <input id="username" name="username" value="{{ username }}" autocapitalize="none"
           autocorrect="off" spellcheck="false" required {% if not username %}autofocus{% endif %}>

    <label for="code">Doğrulama kodu</label>
    <input id="code" name="code" class="code" inputmode="numeric" pattern="[0-9 ]{6,7}"
           maxlength="7" placeholder="••••••" autocomplete="one-time-code" required
           {% if username %}autofocus{% endif %}>

    <button type="submit">Giriş yap</button>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <div class="hint">Kodu telefonunuzdaki Authenticator uygulamasından
      (Google / Microsoft Authenticator vb.) "Crypto Manager" kaydına bakarak girin.</div>
  </form>
</body>
</html>
